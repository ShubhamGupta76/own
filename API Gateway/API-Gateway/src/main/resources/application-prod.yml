server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:https://devblocker-frontend.onrender.com}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
      routes:
       
        - id: notification-websocket
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service.onrender.com}
          predicates:
            - Path=/ws/notifications/**
        
        - id: chat-websocket
          uri: ${CHAT_SERVICE_URL:http://chat-service.onrender.com}
          predicates:
            - Path=/ws/chat/**
        
        
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service.onrender.com}
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/?(?<segment>.*), /api/v1/auth/$\{segment}
        
        
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service.onrender.com}
          predicates:
            - Path=/users/**
          filters:
            - RewritePath=/users/?(?<segment>.*), /api/v1/users/$\{segment}
        
        - id: employee-service
          uri: ${USER_SERVICE_URL:http://user-service.onrender.com}
          predicates:
            - Path=/employees/**
          filters:
            - RewritePath=/employees/?(?<segment>.*), /api/v1/employees/$\{segment}
        
        - id: organization-service
          uri: ${USER_SERVICE_URL:http://user-service.onrender.com}
          predicates:
            - Path=/organizations/**
          filters:
            - RewritePath=/organizations/?(?<segment>.*), /api/v1/organizations/$\{segment}
        
        - id: team-service
          uri: ${TEAM_SERVICE_URL:http://team-service.onrender.com}
          predicates:
            - Path=/teams/**
          filters:
            - RewritePath=/teams/?(?<segment>.*), /api/v1/teams/$\{segment}
        
        # Channel service - team channels route (must come before general channels route)
        - id: channel-service-team-channels
          uri: ${CHANNEL_SERVICE_URL:http://channel-service.onrender.com}
          predicates:
            - Path=/channels/teams/**
          filters:
            - RewritePath=/channels/teams/?(?<segment>.*), /api/v1/teams/$\{segment}
        
        # Channel service - general routes
        - id: channel-service
          uri: ${CHANNEL_SERVICE_URL:http://channel-service.onrender.com}
          predicates:
            - Path=/channels/**
          filters:
            - RewritePath=/channels/?(?<segment>.*), /api/v1/channels/$\{segment}
        
        
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://chat-service.onrender.com}
          predicates:
            - Path=/chat/**
          filters:
            - RewritePath=/chat/?(?<segment>.*), /api/v1/chat/$\{segment}
        
        
        - id: meeting-service
          uri: ${MEETING_SERVICE_URL:http://meeting-service.onrender.com}
          predicates:
            - Path=/meetings/**
          filters:
            - RewritePath=/meetings/?(?<segment>.*), /api/v1/meetings/$\{segment}
    
        - id: file-service
          uri: ${FILE_SERVICE_URL:http://file-service.onrender.com}
          predicates:
            - Path=/files/**
          filters:
            - RewritePath=/files/?(?<segment>.*), /api/v1/files/$\{segment}
        
        
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service.onrender.com}
          predicates:
            - Path=/notifications/**
          filters:
            - RewritePath=/notifications/?(?<segment>.*), /api/v1/notifications/$\{segment}
        
        
        - id: task-service
          uri: ${TASK_SERVICE_URL:http://task-service.onrender.com}
          predicates:
            - Path=/tasks/**
          filters:
            - RewritePath=/tasks/?(?<segment>.*), /api/v1/tasks/$\{segment}


jwt:
  secret: ${JWT_SECRET:DevBlockerSecretKeyForJWTTokenGeneration123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
  enabled: false


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}
    com.connect.API.Gateway: ${LOG_LEVEL:INFO}
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

