spring.application.name=User
server.port=8102

# ===============================
# MONGODB CONFIGURATION
# ===============================
spring.mongodb.uri=${MONGODB_URI:mongodb+srv://gshubhamkumar01:dwMIFXB9Yne3sw5c@cluster0.htoijrv.mongodb.net/user_db?retryWrites=true&w=majority&appName=Cluster0}
spring.mongodb.database=${MONGODB_DATABASE:user_db}
spring.data.mongodb.auto-index-creation=false

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:DevBlockerSecretKeyForJWTTokenGeneration123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# SERVICE COMMUNICATION
# ===============================
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8101}

# ===============================
# ACTUATOR / METRICS
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# ===============================
# LOGGING
# ===============================
logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
