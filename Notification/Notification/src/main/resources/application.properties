spring.application.name=Notification
server.port=8108

# ===============================
# MONGODB CONFIGURATION
# ===============================
spring.mongodb.uri=${MONGODB_URI:mongodb+srv://gshubhamkumar01:dwMIFXB9Yne3sw5c@cluster0.htoijrv.mongodb.net/notification_db?retryWrites=true&w=majority&appName=Cluster0}
spring.mongodb.database=${MONGODB_DATABASE:notification_db}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:DevBlockerSecretKeyForJWTTokenGeneration123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

logging.level.root=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
