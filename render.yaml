# Render Blueprint - Deploy all services at once
# Go to Render Dashboard → New → Blueprint → Connect this file
# 
# IMPORTANT: Before deploying, set these environment variables in Render Dashboard:
# - MONGODB_URI (for each service with appropriate database name)
# - JWT_SECRET (same for all services)
# - SPRING_KAFKA_BOOTSTRAP_SERVERS (if using Kafka, otherwise leave empty)

services:
  # Auth Service
  - type: web
    name: auth-service
    env: java
    buildCommand: cd Auth/Auth && mvn clean package -DskipTests
    startCommand: cd Auth/Auth && java -jar target/*.jar
    envVars:
      - key: SERVER_PORT
        value: 8101
      - key: MONGODB_URI
        sync: false  # Set manually: mongodb+srv://username:password@cluster.mongodb.net/auth_db?retryWrites=true&w=majority
      - key: MONGODB_DATABASE
        value: auth_db
      - key: JWT_SECRET
        sync: false  # Set manually: same secret for all services
      - key: USER_SERVICE_URL
        fromService:
          name: user-service
          type: web
          property: host

  # User Service
  - type: web
    name: user-service
    env: java
    buildCommand: cd User/User && mvn clean package -DskipTests
    startCommand: cd User/User && java -jar target/*.jar
    envVars:
      - key: SERVER_PORT
        value: 8102
      - key: MONGODB_URI
        sync: false  # Set manually: mongodb+srv://username:password@cluster.mongodb.net/user_db?retryWrites=true&w=majority
      - key: MONGODB_DATABASE
        value: user_db
      - key: JWT_SECRET
        sync: false

  # Team Service
