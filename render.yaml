# Render Blueprint - Deploy all services at once
# Go to Render Dashboard → New → Blueprint → Connect this file

services:
  # Database
  - type: pspg
    name: devblocker-db
    plan: free
    databaseName: devblocker
    user: devblocker_user

  # Auth Service
  - type: web
    name: auth-service
    env: java
    buildCommand: cd Auth/Auth && mvn clean package -DskipTests
    startCommand: cd Auth/Auth && java -jar target/*.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: devblocker-db
          property: connectionString
      - key: SERVER_PORT
        value: 8101
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false  # Set manually in dashboard

  # User Service
  - type: web
    name: user-service
    env: java
    buildCommand: cd User/User && mvn clean package -DskipTests
    startCommand: cd User/User && java -jar target/*.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: devblocker-db
          property: connectionString
      - key: SERVER_PORT
