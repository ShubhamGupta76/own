        sync: false  # Optional: Set if using Kafka

  # API Gateway
  - type: web
    name: api-gateway
    env: java
    buildCommand: cd "API Gateway/API-Gateway" && mvn clean package -DskipTests
    startCommand: cd "API Gateway/API-Gateway" && java -jar target/*.jar
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: JWT_SECRET
        sync: false  # Must match JWT_SECRET in all services
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          type: web
          property: host
      - key: USER_SERVICE_URL
        fromService:
          name: user-service
          type: web
          property: host
      - key: TEAM_SERVICE_URL
        fromService:
          name: team-service
          type: web
          property: host
      - key: CHANNEL_SERVICE_URL
        fromService:
          name: channel-service
          type: web
          property: host
      - key: CHAT_SERVICE_URL
        fromService:
          name: chat-service
          type: web
          property: host
      - key: MEETING_SERVICE_URL
        fromService:
          name: meeting-service
          type: web
          property: host
      - key: FILE_SERVICE_URL
        fromService:
          name: file-service
          type: web
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: notification-service
          type: web
          property: host
      - key: SEARCH_SERVICE_URL
        fromService:
          name: search-service
          type: web
          property: host
      - key: TASK_SERVICE_URL
        fromService:
          name: task-service
          type: web
          property: host

  # Frontend
  - type: web
    name: devblocker-frontend
    env: node
    buildCommand: cd devblocker && npm install && npm run build
    staticPublishPath: ./devblocker/dist
    envVars:
      - key: VITE_API_GATEWAY_HOST
        fromService:
          name: api-gateway
          type: web
          property: host
      - key: VITE_API_GATEWAY_PORT
        value: 443
      - key: VITE_API_GATEWAY_PROTOCOL
        value: https
